<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Статьи{% endblock %}</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --text: #1f2430;
            --muted: #6b7280;
            --accent: #2f5bea;
            --danger: #d12f2f;
            --border: #e2e5ea;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .container { max-width: 760px; margin: 0 auto; padding: 0 20px; }
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }
        .logo { font-weight: 700; font-size: 1.15rem; color: var(--text); text-decoration: none; }
        main { padding: 32px 0 60px; }
        h1 { margin: 0 0 20px; font-size: 1.8rem; line-height: 1.25; }
        a { color: var(--accent); }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card h2 { margin: 0 0 6px; font-size: 1.25rem; }
        .card h2 a { color: var(--text); text-decoration: none; }
        .card h2 a:hover { color: var(--accent); }
        .meta { color: var(--muted); font-size: 0.9rem; }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
        }
        .btn:hover { opacity: 0.9; }
        .btn-light { background: transparent; color: var(--accent); }
        .btn-danger { background: var(--danger); border-color: var(--danger); }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; margin-bottom: 4px; font-weight: 600; }
        .field input[type="text"],
        .field input[type="number"],
        .field input[type="password"],
        .field textarea,
        .field select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font: inherit;
            background: #fff;
        }
        .field textarea { min-height: 140px; resize: vertical; }
        .errorlist { margin: 4px 0 0; padding: 0; list-style: none; color: var(--danger); font-size: 0.9rem; }
        .help { color: var(--muted); font-size: 0.85rem; }
        .article-image { max-width: 100%; border-radius: 10px; margin: 12px 0; }
        .thumb { max-width: 100%; max-height: 220px; border-radius: 8px; margin: 10px 0; }
        .comment { border-top: 1px solid var(--border); padding: 12px 0; }
        .comment:first-child { border-top: none; }
        .comment strong { display: block; }
        .empty { color: var(--muted); }
        .nav-links { display: flex; align-items: center; gap: 14px; }
        .nav-links form { margin: 0; }
        .nav-user { color: var(--muted); font-size: 0.95rem; }
        .link-btn {
            padding: 0;
            border: none;
            background: none;
            color: var(--accent);
            font: inherit;
            cursor: pointer;
        }
        .link-btn:hover { text-decoration: underline; }
        .messages { list-style: none; margin: 0 0 20px; padding: 0; }
        .messages li {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
        }
        .messages .error { border-color: var(--danger); color: var(--danger); }
        .messages .success { border-color: #2e9d5b; color: #2e9d5b; }
        .comment .actions { margin-top: 8px; }
    </style>
</head>
<body>
    <header>
        <div class="container nav">
            <a class="logo" href="{% url 'article_list' %}">Статьи</a>

            <nav class="nav-links">
                {% if user.is_authenticated %}
                    <a href="{% url 'comments_list' %}">Мои комментарии</a>
                    <span class="nav-user">{{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{% url 'article_list' %}">
                        <button class="link-btn" type="submit">Выйти</button>
                    </form>
                    <a class="btn" href="{% url 'article_create' %}">Новая статья</a>
                {% else %}
                    <a href="{% url 'login' %}">Войти</a>
                    <a class="btn" href="{% url 'signup' %}">Регистрация</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% if messages %}
                <ul class="messages">
                    {% for message in messages %}
                        <li class="{{ message.tags }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}

            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
