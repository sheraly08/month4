{% extends "base.html" %}

{% block title %}Редактирование комментария{% endblock %}

{% block content %}
    <h1>Редактирование комментария</h1>

    <form class="card" method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}
            <div class="field">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}

        <div class="actions">
            <button class="btn" type="submit">Сохранить</button>
            <a class="btn btn-light" href="{% url 'article_detail' id=form.instance.article_id %}">Отмена</a>
        </div>
    </form>
{% endblock %}
