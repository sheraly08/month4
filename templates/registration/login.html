{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
    <h1>Вход</h1>

    <form class="card" method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        {{ form.non_field_errors }}

        {% for field in form %}
            <div class="field">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}

        <div class="actions">
            <button class="btn" type="submit">Войти</button>
            <a class="btn btn-light" href="{% url 'signup' %}">Регистрация</a>
        </div>
    </form>
{% endblock %}
